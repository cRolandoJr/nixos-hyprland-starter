name: "CI NixOS Hyprland Starter"

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]

permissions:
  contents: read
    
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install dependencies
        run: pip install flake8
      - name: Lint
        run: flake8 .
      - name: "waybar test"
        run: python3 tests/test_waybar_nixos_status.py

  nixos-flake-test:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Nix"
        uses: DeterminateSystems/nix-installer-action@main
      - name: "Setup Magic Nix Cache"
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: "Pre-commit checks (nixfmt, statix, deadnix)"
        run: nix build --no-link .#checks.x86_64-linux.pre-commit-check
      - name: "Evaluate NixOS hosts"
        run: |
          nix eval --raw .#nixosConfigurations.starter-vm.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.equipo.config.networking.hostName

  ryogami-build:
    name: "Build Ryogami (includes Go tests)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Install Nix"
        uses: DeterminateSystems/nix-installer-action@main
      - name: "Build vendored Ryogami package and run Go tests"
        run: |
          # The custom derivation runs 'go test ./...' in its buildPhase.
          nix build --show-trace --print-build-logs --no-link --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = flake.inputs.nixpkgs.legacyPackages.x86_64-linux;
            in pkgs.callPackage ./pkgs/ryogami/default.nix { }
          '
